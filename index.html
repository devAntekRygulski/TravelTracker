<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/travel-tracker-logo.png" />
    <link rel="apple-touch-icon" href="/travel-tracker-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Travel Tracker</title>
    <script>
      (function () {
        try {
          var fromUrl = new URLSearchParams(location.search).get('theme');
          var mode =
            fromUrl === 'light' || fromUrl === 'dark'
              ? fromUrl
              : localStorage.getItem('color-mode');
          document.documentElement.dataset.theme =
            mode === 'light' ? 'light' : 'dark';
          if (fromUrl === 'light' || fromUrl === 'dark') {
            localStorage.setItem('color-mode', fromUrl);
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
